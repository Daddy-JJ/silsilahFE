<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Hexagon Frame Gradient -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Avatar Gradient -->
    <linearGradient id="avatarAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Modular Hexagon Frame (Transparent Interior) -->
  <!-- Center: (400, 400), Radius: 260 -->
  <polygon points="
    400,140
    625,270
    625,530
    400,660
    175,530
    175,270" 
    fill="none" 
    stroke="url(#hexGrad)" 
    stroke-width="16" 
    stroke-linejoin="round"/>

  <!-- Inner Connection Circuit Lines -->
  <g stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 8" fill="none">
    <line x1="400" y1="140" x2="400" y2="280"/>
    <line x1="175" y1="530" x2="310" y2="440"/>
    <line x1="625" y1="530" x2="490" y2="440"/>
  </g>

  <!-- Family Figures Nexus (Father, Mother, Child) -->
  <!-- Father Figure (Top-Left) -->
  <g>
    <circle cx="310" cy="300" r="32" fill="#6366F1" filter="url(#softGlow)"/>
    <path d="M240,410 C240,365 270,355 310,355 C350,355 380,365 380,410" 
          fill="none" 
          stroke="#6366F1" 
          stroke-width="14" 
          stroke-linecap="round"/>
  </g>

  <!-- Mother Figure (Top-Right) -->
  <g>
    <circle cx="490" cy="300" r="32" fill="#06B6D4" filter="url(#softGlow)"/>
    <path d="M420,410 C420,365 450,355 490,355 C530,355 560,365 560,410" 
          fill="none" 
          stroke="#06B6D4" 
          stroke-width="14" 
          stroke-linecap="round"/>
  </g>

  <!-- Child Figure & Nexus Connection (Center-Bottom) -->
  <g>
    <!-- Unifying Trunk / Base Node -->
    <path d="M310,410 L400,470 L490,410" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <line x1="400" y1="470" x2="400" y2="570" stroke="#334155" stroke-width="8" stroke-linecap="round"/>

    <circle cx="400" cy="490" r="28" fill="url(#avatarAmber)" filter="url(#softGlow)"/>
    <path d="M340,580 C340,545 365,535 400,535 C435,535 460,545 460,580" 
          fill="none" 
          stroke="url(#avatarAmber)" 
          stroke-width="12" 
          stroke-linecap="round"/>
  </g>

  <!-- Modular Ports (Connection Terminals at Hexagon Vertices) -->
  <g fill="#FFFFFF" filter="url(#softGlow)">
    <circle cx="400" cy="140" r="14" stroke="#6366F1" stroke-width="6"/>
    <circle cx="625" cy="270" r="14" stroke="#06B6D4" stroke-width="6"/>
    <circle cx="625" cy="530" r="14" stroke="#3B82F6" stroke-width="6"/>
    <circle cx="400" cy="660" r="14" stroke="#6366F1" stroke-width="6"/>
    <circle cx="175" cy="530" r="14" stroke="#3B82F6" stroke-width="6"/>
    <circle cx="175" cy="270" r="14" stroke="#06B6D4" stroke-width="6"/>
  </g>
</svg>
